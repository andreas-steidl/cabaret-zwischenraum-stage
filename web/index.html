<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kleinkunstbühne Zwischenraum</title>
<link rel="alternate" hreflang="de" href="https://zwischenraum.special.at/de/">
<link rel="alternate" hreflang="en" href="https://zwischenraum.special.at/en/">
<link rel="alternate" hreflang="x-default" href="https://zwischenraum.special.at/">
<link rel="icon" href="favicon.ico" sizes="any">
<script>
// Sprachwaehler nach WIE_MACH_ICH_SPRACHEN.md, Abschnitt 4
// waehle-anfang
var SPRACHEN = ["de", "en"];
var GRUND = "en";
function waehle(gespeichert, liste) {
  if (gespeichert && SPRACHEN.indexOf(gespeichert) >= 0) return gespeichert;
  for (var i = 0; i < liste.length; i++) {
    var teil = String(liste[i] || "").toLowerCase().split(/[-_]/)[0];
    if (SPRACHEN.indexOf(teil) >= 0) return teil;
  }
  return GRUND;
}
// waehle-ende
(function () {
  var gespeichert = null;
  try { gespeichert = localStorage.getItem("sprache"); } catch (e) {}
  var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ""];
  location.replace(waehle(gespeichert, liste) + "/index.html" + location.search + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=en/index.html"></noscript>
</head>

<noscript><p><a href="en/index.html" hreflang="en" lang="en">English</a> · <a href="de/index.html" hreflang="de" lang="de">Deutsch</a></p></noscript>
</body>
</html>
